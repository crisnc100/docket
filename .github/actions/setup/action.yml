name: setup
description: Install uv, Node and the locked Python dependencies, with their caches.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-local-path: ${{ github.workspace }}/.cache/uv
        cache-dependency-glob: uv.lock
    - shell: bash
      run: uv sync --locked
