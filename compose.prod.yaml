# The hosted beta on one host, behind Caddy. See "Run the hosted beta" in the README.
#   docker compose -f compose.prod.yaml --env-file .env.beta up -d --build --wait
# Every value comes from .env.beta (never committed; see .env.beta.example). Without
# --env-file, compose stops and names the first missing value.
name: docket-hosted

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Every process that runs Docket code. The model key is not here: only the worker gets it.
x-docket-environment: &docket-environment
  DOCKET_ENV: beta
  DATABASE_URL: postgresql+psycopg://docket:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.beta}@postgres:5432/docket
  TEMPORAL_ADDRESS: temporal:7233
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.beta}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.beta}
  S3_BUCKET: docket
  DOCKET_ADDRESS_KEY: ${DOCKET_ADDRESS_KEY:?set DOCKET_ADDRESS_KEY in .env.beta}
  DOCKET_BASE_URL: ${DOCKET_BASE_URL:?set DOCKET_BASE_URL in .env.beta}
  DOCKET_TRUST_PROXY: ${DOCKET_TRUST_PROXY:?set DOCKET_TRUST_PROXY in .env.beta}
  DOCKET_DAILY_BUDGET_USD: ${DOCKET_DAILY_BUDGET_USD:?set DOCKET_DAILY_BUDGET_USD in .env.beta}
  DOCKET_MODEL_MODE: ${DOCKET_MODEL_MODE:?set DOCKET_MODEL_MODE in .env.beta}
  DOCKET_REVIEW_TIMEOUT_SECONDS: ${DOCKET_REVIEW_TIMEOUT_SECONDS:?set DOCKET_REVIEW_TIMEOUT_SECONDS in .env.beta}

services:
  # The Temporal image runs as uid 1000, and a new volume belongs to root.
  temporal-data-init:
    image: temporalio/temporal:1.5.1@sha256:597a5dbbcc6e7716b326dde4a51622d5ea0879eb0cf06ff8a94381361d0a987d
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /data/server && chown 1000:1000 /data/server"]
    volumes: ["temporal-data:/data"]
    mem_limit: 32m
    cpus: 0.25
    logging: *logging

  # The single-process dev server with a SQLite file: enough for a demo that resets nightly
  # (docs/adr/009-hosting.md). Its UI is not published.
  temporal:
    image: temporalio/temporal:1.5.1@sha256:597a5dbbcc6e7716b326dde4a51622d5ea0879eb0cf06ff8a94381361d0a987d
    depends_on:
      temporal-data-init:
        condition: service_completed_successfully
    command: server start-dev --ip 0.0.0.0 --db-filename /data/server/temporal.db
    volumes: ["temporal-data:/data"]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    logging: *logging
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16.16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    environment:
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.beta}
      POSTGRES_DB: docket
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docket -d docket"]
      interval: 10s
      timeout: 5s
      retries: 30

  # The S3 identities file is written from the environment at start, so the keys live only
  # in .env.beta. They must be letters and digits, since they go into JSON as they are.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.beta}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.beta}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 &&
        printf '{"identities":[{"name":"docket","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec /usr/bin/weed -logtostderr=true mini -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
        -s3.port=8333 -s3.config=/tmp/s3.json -s3.autoCreateBucket=false -webdav=false
        -admin.ui=false -s3.port.iceberg=0 -s3.port.lance=0 -master.telemetry=false
    volumes: ["seaweedfs-data:/data"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    image: docket-hosted-app
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://docket:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.beta}@postgres:5432/docket
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  api:
    build: .
    image: docket-hosted-app
    # Docket reads X-Forwarded-For itself (DOCKET_TRUST_PROXY), so uvicorn must not.
    command:
      ["uvicorn", "docket.api:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    environment: *docket-environment
    ports:
      # Only Caddy on this host can reach it.
      - "127.0.0.1:${DOCKET_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 30

  worker:
    build: .
    image: docket-hosted-app
    command: ["python", "-m", "docket.worker"]
    environment:
      <<: *docket-environment
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env.beta}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/docket-worker-ready').is_file()"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Resets the demo at 08:00 UTC, and at start when that run was missed.
  reset:
    build: .
    image: docket-hosted-app
    command: ["docket", "beta-reset", "--daily"]
    environment: *docket-environment
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/docket-reset-ready').is_file()"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  temporal-data:
  seaweedfs-data:
