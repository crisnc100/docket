services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: docket # pragma: allowlist secret
      POSTGRES_DB: docket
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docket -d docket"]
      interval: 3s
      timeout: 3s
      retries: 40
  temporal-data-init:
    image: temporalio/temporal:1.5.1
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /data/server && chown 1000:1000 /data/server"]
    volumes: ["temporal-data:/data"]
  temporal:
    image: temporalio/temporal:1.5.1
    depends_on:
      temporal-data-init:
        condition: service_completed_successfully
    command: server start-dev --ip 0.0.0.0 --db-filename /data/server/temporal.db
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporal-data:/data"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 40
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: >-
      mini -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json -s3.autoCreateBucket=false -webdav=false -admin.ui=false
      -s3.port.iceberg=0 -s3.port.lance=0 -master.telemetry=false
    ports: ["127.0.0.1:9000:8333"]
    volumes:
      - seaweedfs-data:/data
      - ./config/s3.local.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40

  migrate:
    build: .
    image: docket-v01-migrate
    command: ["alembic", "upgrade", "head"]
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://docket:docket@postgres:5432/docket # pragma: allowlist secret
      TEMPORAL_ADDRESS: temporal:7233
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: docket-local
      S3_SECRET_KEY: docket-local-password # pragma: allowlist secret
      S3_BUCKET: docket
      DOCKET_MODEL_MODE: ${DOCKET_MODEL_MODE:-replay}
      DOCKET_WEBHOOK_SECRET: ${DOCKET_WEBHOOK_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DOCKET_MODEL_PROVIDER: ${DOCKET_MODEL_PROVIDER:-openrouter}
      DOCKET_MODEL: ${DOCKET_MODEL:-openai/gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    image: docket-v01-api
    command: ["uvicorn", "docket.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-environment
      DOCKET_REVIEW_TOKEN: ${DOCKET_REVIEW_TOKEN:-}
      DOCKET_WEBHOOK_RATE_LIMIT: ${DOCKET_WEBHOOK_RATE_LIMIT:-60}
    ports: ["127.0.0.1:8010:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 40
  worker:
    build: .
    image: docket-v01-worker
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/docket-worker-ready').is_file()"]
      interval: 3s
      timeout: 3s
      retries: 40

  browser:
    profiles: ["test"]
    build:
      context: .
      target: browser
    image: docket-v01-browser
    init: true
    shm_size: 256mb

volumes:
  postgres-data:
  temporal-data:
  seaweedfs-data:
