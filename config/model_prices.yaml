# Prices in US dollars per million tokens. The API reports tokens, not dollars,
# so Docket's costs are tokens times these prices. Update the date and source
# together with any price.
snapshot_date: "2026-11-12"
source: https://platform.claude.com/docs/en/about-claude/pricing
models:
  claude-haiku-5-5:
    provider: anthropic
    kind: list_price
    input_per_million: "0.10"
    output_per_million: "0.50"
    # Prompts above this many input tokens bill every token at the long prices.
    long_prompt_tokens: 100000
    long_input_per_million: "0.50"
    long_output_per_million: "2.50"
  openai/gpt-4o-mini:
    provider: openrouter
    # A ceiling sent to OpenRouter as max_price. OpenRouter reports the real cost.
    kind: ceiling
    input_per_million: "0.30"
    output_per_million: "1.20"
