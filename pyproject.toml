[project]
name = "docket"
version = "0.1.0"
description = "Durable document intake and filing"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi", "uvicorn", "python-multipart", "pydantic>=2", "pydantic-settings",
  "pyyaml", "sqlalchemy>=2", "alembic", "psycopg[binary]", "temporalio",
  "pypdf", "rapidfuzz", "reportlab", "faker", "langchain-openai", "boto3", "typer", "httpx",
]

[project.scripts]
docket = "docket.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "pyright", "detect-secrets"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
include = ["docket"]
typeCheckingMode = "basic"
strict = ["docket/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --basetemp=.cache/pytest"
