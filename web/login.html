<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docket · Reviewer access</title>
  <link rel="preload" href="/home/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/home/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style nonce="__NONCE__">
    /* The review app's stylesheet arrives as a blob: URL, which cannot resolve /home/ paths,
       so the fonts and colour tokens it uses by name are declared here, in the page itself. */
    @font-face { font-family: "Geist"; src: url("/home/fonts/geist-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Geist Mono"; src: url("/home/fonts/geist-mono-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    :root {
      --bg: #ffffff; --ink: #16181d; --ink-2: #4f5562; --ink-muted: #6b717c; --ink-hover: #2c3039;
      --soft: #f6f7f9; --line: #e2e4e9; --line-strong: #c9ccd3;
      --filed: #17614f; --filed-bg: #e8f3ef; --filed-text: #1f4d42;
      --held: #8a4b00; --held-bg: #fbf1e1; --held-text: #5f3a08;
      --focus: #2f5bd3; --clue-mark: #e7ecfa;
      --radius: 8px; --gutter: clamp(16px, 4.4vw, 64px);
      --lift: 0 1px 2px rgba(22, 24, 29, 0.04), 0 12px 32px -12px rgba(22, 24, 29, 0.12);
      --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.55 var(--sans); font-feature-settings: "tnum" 1; text-rendering: optimizeLegibility; }
    ::selection { background: var(--clue-mark); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .access { width: min(25rem, calc(100% - 32px)); margin: 14vh auto 48px; padding: 28px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--bg); box-shadow: var(--lift); }
    .access h1 { margin: 0; font-size: 1.1875rem; font-weight: 700; letter-spacing: -0.02em; }
    .access .note { margin: 6px 0 24px; color: var(--ink-2); font-size: 0.9375rem; }
    .access label { display: block; font-size: 0.9375rem; font-weight: 600; letter-spacing: -0.01em; }
    .access input { display: block; width: 100%; min-height: 44px; margin: 8px 0 16px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 0; background: var(--bg); color: var(--ink); font: 0.9375rem var(--mono); caret-color: var(--ink); }
    .access input:hover { border-color: var(--ink-muted); }
    .access button { display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 44px; padding: 0 18px; border: 0; border-radius: var(--radius); background: var(--ink); color: var(--bg); font: 600 0.9375rem var(--sans); cursor: pointer; touch-action: manipulation; transition: background-color 120ms ease-out; }
    .access button:hover { background: var(--ink-hover); }
    .access button:disabled { background: var(--ink-muted); cursor: progress; }
    .access [role="status"] { margin: 12px 0 0; color: var(--ink-2); font-size: 0.875rem; }
    .access [role="status"]:empty { margin: 0; }
  </style>
</head>
<body>
<div id="app">
  <form class="access">
    <h1>Docket</h1>
    <p class="note">Document review, for the property-operations team.</p>
    <label for="review-token">Reviewer token</label>
    <input id="review-token" type="password" autocomplete="off" required autofocus>
    <button type="submit">Unlock review</button>
    <p role="status"></p>
  </form>
</div>
<script nonce="__NONCE__">
(() => {
  const assets = __ASSETS__;
  const key = 'docket-review-token';
  const form = document.querySelector('form');
  const input = document.querySelector('input');
  const message = document.querySelector('[role="status"]');
  const button = document.querySelector('button');
  const urls = [];
  async function unlock(token) {
    button.disabled = true;
    message.textContent = 'Checking access…';
    const headers = { Authorization: 'Bearer ' + token };
    try {
      const response = await fetch('/review', { headers, cache: 'no-store' });
      if (!response.ok) throw Object.assign(new Error(response.status === 401 ? 'Invalid reviewer token.' : await response.text()), { status: response.status });
      const styles = await Promise.all(assets.styles.map(async path => {
        const response = await fetch(path, { headers, cache: 'no-store' });
        if (!response.ok) throw Object.assign(new Error('Unable to load the review page.'), { status: response.status });
        return URL.createObjectURL(await response.blob());
      }));
      const scripts = await Promise.all(assets.scripts.map(async path => {
        const response = await fetch(path, { headers, cache: 'no-store' });
        if (!response.ok) throw Object.assign(new Error('Unable to load the review page.'), { status: response.status });
        return URL.createObjectURL(await response.blob());
      }));
      sessionStorage.setItem(key, token);
      input.value = '';
      document.querySelector('#app').replaceChildren();
      styles.forEach(url => {
        urls.push(url);
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = url;
        document.head.append(link);
      });
      for (const url of scripts) {
        urls.push(url);
        await import(url);
      }
    } catch (error) {
      if (error?.status === 401) sessionStorage.removeItem(key);
      message.textContent = error instanceof Error ? error.message : 'Unable to unlock review.';
    } finally {
      button.disabled = false;
    }
  }
  form.addEventListener('submit', event => {
    event.preventDefault();
    void unlock(input.value);
  });
  window.addEventListener('pagehide', () => urls.forEach(url => URL.revokeObjectURL(url)));
  const saved = sessionStorage.getItem(key);
  if (saved) void unlock(saved);
})();
</script>
</body>
</html>
